apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: keyvault-request
  title: Azure KeyVault
  description: |
    Request an Azure KeyVault in your team's resource group. Available to the
    Product and Research teams — provisioned directly, no approval required.
  tags:
    - platform
    - kratix
    # Gated by the platform permission policy — only Product and Research members
    # can execute this template (see backend/src/permissionPolicy.ts)
    - features-only
  # The label hides the entity from catalog/Create lists for non-members;
  # the tag above additionally blocks scaffolder parameter/step access.
  labels:
    teknologi.io/access: features-only
spec:
  owner: group:platform-core
  type: resource

  parameters:
    - title: KeyVault details
      description: |
        The vault is created as `kv-{appName}-{environment}` inside your team's
        resource group `teknologi-eur1-{environment}-{appName}-rg` (created during
        team onboarding).
      required:
        - appName
        - environment
      properties:
        appName:
          title: Application Name
          type: string
          description: Your onboarded team/application name
          pattern: '^[a-z][a-z0-9-]*$'
          maxLength: 20
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, tst, acc, prd]
        location:
          title: Azure Region
          type: string
          default: westeurope
          enum: [westeurope, northeurope]

  steps:
    - id: request-keyvault
      name: Submit KeyVault request
      action: kratix:apply
      input:
        manifest:
          apiVersion: marketplace.kratix.io/v1alpha1
          kind: KeyVaultRequest
          metadata:
            name: ${{ parameters.appName }}-${{ parameters.environment }}-kv
            namespace: kratix-workloads
            labels:
              backstage.io/kubernetes-id: ${{ parameters.appName }}
          spec:
            appName: ${{ parameters.appName }}
            environment: ${{ parameters.environment }}
            location: ${{ parameters.location }}
            resourceGroupName: teknologi-eur1-${{ parameters.environment }}-${{ parameters.appName }}-rg

  output:
    text:
      - title: Request submitted
        content: |
          KeyVault `kv-${{ parameters.appName }}-${{ parameters.environment }}` is being
          provisioned in `teknologi-eur1-${{ parameters.environment }}-${{ parameters.appName }}-rg`.
          You will receive a Slack notification when it is live.
