---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: sat
  namespace: default
  # Fixes the EntityRelationWarning seen on onboarded-team pages (2026-07-27):
  # team-onboarding's businessUnit enum ([fundamentals, sat, features, re]) sets
  # spec.parent to the literal value "sat" for every onboarded stream-aligned
  # team, but no group:default/sat existed — only the specific sat-ecommerce
  # team did. "sat" is the parent business unit; multiple specific SAT teams
  # (sat-ecommerce and any future ones) roll up into it as children.
  description: Stream-Aligned Teams — business-unit parent for teams onboarded with businessUnit=sat
spec:
  type: business-unit
  profile:
    displayName: SAT
    email: sat@teknologi.nl
  parent: platform-engineering
  children:
    - sat-ecommerce
---
apiVersion: backstage.io/v1alpha1
