    github.com/user-id: MDQ6VXNlcjMwMjI1NTA3
    # Entra ID (Microsoft) email — matched by emailMatchingUserEntityAnnotation.
    microsoft.com/email: ashwin.sarimin@teknologi.nl
    # Guest auth is removed (RBAC hardening) — the other three demo users
    # (alex-de-vries, sara-bergman, kai-lindqvist) are fictional and have no
    # real account with either provider, so they cannot sign in at all now.
spec:
  profile:
