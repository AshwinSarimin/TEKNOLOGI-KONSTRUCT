apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: commerce
  namespace: default
  # Fixes the EntityRelationWarning seen on onboarded-team pages (2026-07-27):
  # team-onboarding's businessUnit enum ([platform-core, commerce, product, research]) sets
  # spec.parent to the literal value "commerce" for every onboarded team under
  # that business unit, but no group:default/commerce existed — only the specific
  # commerce-ecommerce team did. "commerce" is the parent business unit; multiple
  # specific commerce teams (commerce-ecommerce and any future ones) roll up into
  # it as children.
  description: Business-unit parent for teams onboarded with businessUnit=commerce
spec:
  type: business-unit
  profile:
    displayName: Commerce
    email: commerce@teknologi.nl
  parent: platform-engineering
  children:
    - commerce-ecommerce
---
apiVersion: backstage.io/v1alpha1
