# Register this cluster in ArgoCD before anything else syncs
apiVersion: v1
kind: Secret
metadata:
  name: k3d-teknologi-workload-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster-name: k3d-teknologi-workload-cluster
    cluster-type: dev
    cluster-role: workload
    platform.external-secrets: "false" #true
    platform.cert-manager: "true" 
    platform.argocd: "false" #true
    platform.backstage: "false"
    platform.kratix: "false"
    platform.crossplane: "false" #true
    platform.kratix-workloads: "false" #true
type: Opaque
stringData:
  name: k3d-teknologi-workload-cluster
  server: https://kubernetes.default.svc
  config: |
    {
      "tlsClientConfig": {
        "insecure": false
      }
    }
---
# Root Application - deploys all ApplicationSets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AshwinSarimin/TEKNOLOGI-KONSTRUCT.git
    targetRevision: feature/setup_infra
    path: appsets/workload
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true