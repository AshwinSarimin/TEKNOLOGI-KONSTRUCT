configs:
  cm:
    url: https://argocd.konstruct.teknologik8s.nl

# Argo CD's default server role grants patch/delete on every resource. On the
# hub, request writes must pass through an ownership-aware broker (or an admin).
# Sync still runs through the application-controller, and the server's existing
# namespaced role continues to manage Applications in argocd.
server:
  clusterRoleRules:
    enabled: true
    rules:
      - apiGroups: ['*']
        resources: ['*']
        verbs: [get]
      - apiGroups: ['']
        resources: [events]
        verbs: [list, create]
      - apiGroups: ['']
        resources: [pods, pods/log]
        verbs: [get]
      - apiGroups: [argoproj.io]
        resources: [applications, applicationsets]
        verbs: [get, list, update, watch]
      - apiGroups: [batch]
        resources: [jobs]
        verbs: [create]
      - apiGroups: [argoproj.io]
        resources: [workflows]
        verbs: [create]
