apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-azure-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  package: xpkg.upbound.io/upbound/provider-azure-keyvault:v1.3.0
---
# ProviderConfig for Azure — credentials come from azure-creds secret.
# Secret is created manually for now; replaced by ESO in Phase 7.
# Format: az ad sp create-for-rbac --sdk-auth > /tmp/azure-creds.json
# kubectl create secret generic azure-creds --from-file=credentials=/tmp/azure-creds.json -n crossplane-system
apiVersion: azure.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: azure-provider
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: azure-creds
      key: credentials