# clientId/subscriptionId/tenantId are hardcoded literals below, not
# remoteRefs — none of the three are secret (same reasoning as ArgoCD's and
# Backstage's own hardcoded tenantId literals), and ESO's target.template
# can't pull values from a ConfigMap into its {{ }} interpolation context, only
# from this ExternalSecret's own remoteRefs — so unlike the flat
# terraform-azure-creds Secret (which can source these via the pipeline
# container's configMapKeyRef instead), this composed-JSON Secret is the one
# place they still have to be written down directly. Same underlying values as
# platform-config's cloudClientId/cloudSubscriptionId/azureTenantId — update
# both places together if the SP or tenant ever changes. Only clientSecret
# stays sourced from Key Vault. See Architecture.md's "Secret Management".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: azure-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: azure-credentials
    template:
      data:
        credentials: >-
          {"clientId":"a7efd1ee-7493-44f8-a823-2f7fdc85b869","clientSecret":"{{ .clientSecret }}","subscriptionId":"e229909d-d13f-44aa-ae26-046922d181eb","tenantId":"99f9af3a-fd8b-41ec-b487-483a0c562b5c"}
  data:
  - secretKey: clientSecret
    remoteRef:
      key: platform-cloud-client-secret
