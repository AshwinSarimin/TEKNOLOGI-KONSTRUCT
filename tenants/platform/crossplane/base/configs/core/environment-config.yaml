# Platform-level Azure constants injected into all Compositions via EnvironmentConfig.
# Requesters never see or set these values — they are platform team concerns.
# Per-environment overrides: patch this file in overlays/dev, overlays/prd, etc.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: platform-azure
data:
  tenantId: "99f9af3a-fd8b-41ec-b487-483a0c562b5c"         # Replace: az account show --query tenantId -o tsv
  subscriptionId: "e229909d-d13f-44aa-ae26-046922d181eb"   # Replace: az account show --query id -o tsv
  defaultResourceGroup: "teknologi-eur1-prd-platform-rg"
  defaultLocation: "westeurope"