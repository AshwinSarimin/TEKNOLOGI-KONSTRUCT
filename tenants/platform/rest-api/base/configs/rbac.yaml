# The REST API authenticates each caller and enforces request ownership before
# a version-checked update. Only create/get/update are needed by its endpoint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rest-api
  namespace: rest-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rest-api-requester
rules:
- apiGroups: ["marketplace.kratix.io"]
  resources:
  - teamonboardingrequests
  - namespacerequests
  - keyvaultrequests
  - storageaccountrequests
  - storageaccountterraformrequests
  verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rest-api-requester
  namespace: kratix-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rest-api-requester
subjects:
- kind: ServiceAccount
  name: rest-api
  namespace: rest-api
