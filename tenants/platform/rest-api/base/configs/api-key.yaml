# JSON object mapping stable caller IDs to distinct bearer tokens (API_KEYS).
# Bootstrap platform-rest-api-keys in Key Vault before deploying this revision;
# see README. The old shared platform-rest-api-key is deliberately not a fallback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rest-api-key
  namespace: rest-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: rest-api-key
  data:
  - secretKey: apiKeys
    remoteRef:
      key: platform-rest-api-keys
