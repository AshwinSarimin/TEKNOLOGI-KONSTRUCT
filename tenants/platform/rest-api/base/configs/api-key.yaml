# Shared bearer token external callers present as `Authorization: Bearer <key>`.
# Value lives only in Key Vault — bootstrap once via:
#   az keyvault secret set --vault-name teknologi-eur1-kv --name platform-rest-api-key --value <generated-value>
# (same one-time-manual pattern as the other platform bootstrap secrets — see
# Architecture.md "Secret Management" and Experiments.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rest-api-key
  namespace: rest-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: rest-api-key
  data:
  - secretKey: apiKey
    remoteRef:
      key: platform-rest-api-key
