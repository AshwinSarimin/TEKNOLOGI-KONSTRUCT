apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: entra-id
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: entra-id
  data:
  - secretKey: clientId
    remoteRef:
      key: platform-entra-client-id
  - secretKey: clientSecret
    remoteRef:
      key: platform-entra-client-secret
  - secretKey: tenantId
    remoteRef:
      key: platform-entra-tenant-id
