apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage-ingress
  namespace: backstage
spec:
  ingressClassName: traefik
  rules:
  - host: backstage.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backstage-controllers
            port:
              number: 7007
