apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-credentials
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: acr-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # Registry hostname hardcoded — not secret, and this is the one place
        # in the repo it isn't already a literal (every image: reference
        # already hardcodes it). See Architecture.md's "Secret Management".
        .dockerconfigjson: >-
          {"auths":{"teknologieur1acr.azurecr.io":{"username":"{{ .username }}","password":"{{ .password }}"}}}
  data:
  - secretKey: username
    remoteRef:
      key: platform-acr-username
  - secretKey: password
    remoteRef:
      key: platform-acr-password