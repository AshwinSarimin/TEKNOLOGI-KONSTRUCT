# notify-watcher runs on the workload cluster and needs its own copy of this
# secret — the platform cluster's copy (tenants/platform/kratix/base) only
# reaches stage 1, which runs on the platform cluster as part of the Pipeline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: kratix-workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: slack-webhook
  data:
  - secretKey: url
    remoteRef:
      key: platform-slack-webhook-url
