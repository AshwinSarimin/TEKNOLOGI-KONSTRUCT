apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-credentials
  namespace: kratix-platform-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: acr-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"{{ .server }}":{"username":"{{ .username }}","password":"{{ .password }}"}}}
  data:
  - secretKey: server
    remoteRef:
      key: platform-acr-server
  - secretKey: username
    remoteRef:
      key: platform-acr-username
  - secretKey: password
    remoteRef:
      key: platform-acr-password
---
# Pipeline pods run in the same namespace as the resource request.
# kratix-workloads is the single submission namespace, so it needs acr-credentials too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-credentials
  namespace: kratix-workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: acr-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"{{ .server }}":{"username":"{{ .username }}","password":"{{ .password }}"}}}
  data:
  - secretKey: server
    remoteRef:
      key: platform-acr-server
  - secretKey: username
    remoteRef:
      key: platform-acr-username
  - secretKey: password
    remoteRef:
      key: platform-acr-password
---
