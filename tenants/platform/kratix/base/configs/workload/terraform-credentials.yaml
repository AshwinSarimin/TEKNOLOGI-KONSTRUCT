# terraform-backend-config was removed 2026-09-18 — resource_group_name,
# storage_account_name, and container_name were its only fields and none of
# them are secret; storage-account-terraform/promise.yaml now reads them
# directly from the platform-config ConfigMap instead. Only client_secret
# stays here — client_id/tenant_id/subscription_id moved to platform-config
# for the same reason. See Architecture.md's "Secret Management" section.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraform-azure-creds
  namespace: kratix-workloads
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secret-store
    kind: ClusterSecretStore
  target:
    name: terraform-azure-creds
  data:
  - secretKey: client_secret
    remoteRef:
      key: platform-cloud-client-secret
