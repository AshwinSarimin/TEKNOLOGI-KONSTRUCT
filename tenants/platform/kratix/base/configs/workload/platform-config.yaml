# Non-secret platform values shared across Promise pipelines — avoids hardcoding
# these as literals in every promise.yaml. Not an ExternalSecret: nothing here
# is sensitive, so a plain ConfigMap is the right primitive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: kratix-workloads
data:
  argocdUrl: https://argocd.konstruct.teknologik8s.nl
  azureTenantId: 99f9af3a-fd8b-41ec-b487-483a0c562b5c
  orchestrationOwner: AshwinSarimin
  orchestrationRepo: TEKNOLOGI-KONSTRUCT-STATE
  orchestrationBaseBranch: main
  # Added 2026-09-18 — consolidated out of Key Vault (see Architecture.md's
  # "Secret Management" section): these are public identifiers, not secrets,
  # per the same reasoning already applied to azureTenantId above.
  githubAppId: "4461973"
  githubAppInstallationId: "150674345"
  terraformBackendResourceGroup: teknologi-eur1-prd-k8s-rg
  terraformBackendStorageAccount: teknologieur1sa
  terraformBackendContainer: tfstate
  # teknologi-platform-cloud SP's client ID — not the secret. Same tenant as
  # azureTenantId above (one Azure AD tenant for the whole subscription).
  cloudClientId: 62a7a50c-164c-4ba5-9247-031c47a76cc9
  cloudSubscriptionId: e229909d-d13f-44aa-ae26-046922d181eb
