# Allows authenticated users to submit TeamOnboardingRequests to kratix-workloads
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: team-onboarding-requester
rules:
- apiGroups: ["marketplace.kratix.io"]
  resources: ["teamonboardingrequests"]
  verbs: ["create", "get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-onboarding-requester
  namespace: kratix-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: team-onboarding-requester
subjects:
# Explicit broker identity, not system:authenticated (which includes every
# ServiceAccount in the cluster). REST API has its own rest-api-requester binding.
- kind: ServiceAccount
  name: default
  namespace: backstage
