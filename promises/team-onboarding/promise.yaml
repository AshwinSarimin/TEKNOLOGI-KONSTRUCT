apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: team-onboarding
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: teamonboardingrequests.marketplace.kratix.io
    spec:
      group: marketplace.kratix.io
      scope: Namespaced
      names:
        kind: TeamOnboardingRequest
        plural: teamonboardingrequests
        singular: teamonboardingrequest
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - appName
                properties:
                  appName:
                    type: string
                    description: "Application name — used to derive names for all sub-resources"
                  displayName:
                    type: string
                    description: "Human-readable team name for the SSoT team definition"
                  businessUnit:
                    type: string
                    description: "Which stream the team belongs to — used for the SSoT file path"
                    enum: [fundamentals, sat, features, re]
                  description:
                    type: string
                    description: "What the team owns or builds — included in the team definition"
                  productOwner:
                    type: string
                    description: "Catalog entity ref of the Product Owner"
                  engineeringManager:
                    type: string
                    description: "Catalog entity ref of the Engineering Manager"
                  teamMembers:
                    type: array
                    description: "Catalog entity refs of team members"
                    items:
                      type: string
                  environment:
                    type: string
                    description: "Deployment environment"
                    default: dev
                    enum: [dev, tst, acc, prd]
                  location:
                    type: string
                    description: "Azure region"
                    default: westeurope
                  resources:
                    type: object
                    description: "Which resources to provision"
                    properties:
                      namespace:
                        type: boolean
                        default: true
                      keyvault:
                        type: boolean
                        default: false
                      storageAccount:
                        type: boolean
                        default: false
              status:
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  phase:
                    type: string
                    description: "waiting-for-pr-merge | provisioning | approval-timeout"
                  prUrl:
                    type: string
                  appName:
                    type: string
                  environment:
                    type: string
                  provisioned:
                    type: array
                    items:
                      type: string
                  approvedBy:
                    type: string
                    description: "GitHub login of whoever merged the approval PR — empty if provisioning proceeded via the already-onboarded fast path (no PR to attribute)"
                  approvedAt:
                    type: string
                    description: "Timestamp the approval PR was merged, from GitHub's own merged_at field"

  destinationSelectors:
  - matchLabels:
      kratix.destination: "true"

  dependencies:
  # XResourceGroup lets the compound pipeline create a per-team Azure Resource Group
  # directly via /kratix/output, rather than requiring a separate Azure ResourceGroup Promise.
  - apiVersion: apiextensions.crossplane.io/v1
    kind: CompositeResourceDefinition
    metadata:
      name: xresourcegroups.platform.teknologi.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      group: platform.teknologi.io
      names:
        kind: XResourceGroup
        plural: xresourcegroups
      versions:
      - name: v1alpha1
        served: true
        referenceable: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  location:
                    type: string
                    default: westeurope
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xresourcegroup-azure
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        provider: azure
    spec:
      compositeTypeRef:
        apiVersion: platform.teknologi.io/v1alpha1
        kind: XResourceGroup
      mode: Resources
      resources:
      - name: resource-group
        base:
          apiVersion: azure.upbound.io/v1beta1
          kind: ResourceGroup
          spec:
            providerConfigRef:
              name: azure-provider
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.location
          toFieldPath: spec.forProvider.location
          policy:
            fromFieldPath: Optional
        # XR metadata.name becomes the Azure resource group name via external-name.
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: metadata.annotations[crossplane.io/external-name]

  workflows:
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: configure-team-onboarding
        spec:
          imagePullSecrets:
          - name: acr-credentials
          containers:
          - name: configure-team-onboarding
            image: teknologieur1acr.azurecr.io/kratix-team-onboarding:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: STAGE
              value: "configure"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: appID
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: installationID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: privateKey
          - name: notify
            image: teknologieur1acr.azurecr.io/kratix-notify:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: NOTIFY_STAGE
              value: "1"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
                  optional: true
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: argocdUrl
      # pr-watcher is its own Pipeline entry (its own Job), not another container
      # alongside configure-team-onboarding/notify above. Kratix's suspend/retry
      # mechanism (workflow-control.yaml) operates at the Pipeline level: if
      # pr-watcher lived in the same Pipeline as notify, every retryAfter cycle
      # while waiting for PR approval would re-run notify too, re-sending the
      # "request accepted" Slack message on every check. Splitting it out means
      # only pr-watcher itself is retried/suspended while it waits.
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: pr-watcher
        spec:
          imagePullSecrets:
          - name: acr-credentials
          containers:
          - name: pr-watcher
            image: teknologieur1acr.azurecr.io/kratix-team-onboarding:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: STAGE
              value: "watch"
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: appID
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: installationID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: privateKey
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: terraform-azure-creds
                  key: tenant_id
