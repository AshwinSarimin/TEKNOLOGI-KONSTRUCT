apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: storage-account-terraform
spec:
  # StorageAccountTerraformRequest CRD — Terraform-backed variant, kept for comparison with the Crossplane promise
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: storageaccountterraformrequests.marketplace.kratix.io
    spec:
      group: marketplace.kratix.io
      scope: Namespaced
      names:
        kind: StorageAccountTerraformRequest
        plural: storageaccountterraformrequests
        singular: storageaccountterraformrequest
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - appName
                - environment
                - resourceGroupName
                properties:
                  appName:
                    type: string
                    description: "Application name — used to derive the storage account name"
                  environment:
                    type: string
                    description: "Deployment environment"
                    default: dev
                    enum: [dev, tst, acc, prd]
                  location:
                    type: string
                    description: "Azure region (default: westeurope)"
                    default: westeurope
                  resourceGroupName:
                    type: string
                    description: "Azure resource group to provision the storage account into"

  # Destination label matches the Kratix Destination object (not the ArgoCD cluster secret)
  destinationSelectors:
  - matchLabels:
      kratix.destination: "true"

  # No dependencies needed: Terraform-backed Promises have no XRD/Composition to deploy
  # to the workload cluster.

  # Pipeline — runs when a team creates a StorageAccountTerraformRequest.
  # Terraform is synchronous: the configure container provisions the storage account
  # and posts both Slack notifications (started + live) itself.
  workflows:
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: configure-tf
        spec:
          imagePullSecrets:
          - name: acr-credentials
          containers:
          - name: configure-tf
            image: teknologieur1acr.azurecr.io/kratix-storage-account-terraform:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: ARM_USE_AZUREAD
              value: "true"
            - name: TF_BACKEND_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  name: terraform-backend-config
                  key: resource_group_name
            - name: TF_BACKEND_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: terraform-backend-config
                  key: storage_account_name
            - name: TF_BACKEND_CONTAINER
              valueFrom:
                secretKeyRef:
                  name: terraform-backend-config
                  key: container_name
                  optional: true
            - name: ARM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: terraform-azure-creds
                  key: client_id
            - name: ARM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: terraform-azure-creds
                  key: client_secret
            - name: ARM_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: terraform-azure-creds
                  key: tenant_id
            - name: ARM_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: terraform-azure-creds
                  key: subscription_id
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
                  optional: true
