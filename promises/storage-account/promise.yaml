apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: storage-account
spec:
  # StorageAccountRequest CRD — what teams submit to request an Azure Storage Account
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: storageaccountrequests.marketplace.kratix.io
    spec:
      group: marketplace.kratix.io
      scope: Namespaced
      names:
        kind: StorageAccountRequest
        plural: storageaccountrequests
        singular: storageaccountrequest
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - appName
                - environment
                properties:
                  appName:
                    type: string
                    description: "Application name — used to derive the storage account name (tek{appName}{env}sa)"
                  environment:
                    type: string
                    description: "Deployment environment"
                    default: dev
                    enum: [dev, tst, acc, prd]
                  location:
                    type: string
                    description: "Azure region (default: westeurope)"
                    default: westeurope
                  resourceGroupName:
                    type: string
                    description: "Azure resource group (default: teknologi-eur1-prd-platform-rg)"
                    default: teknologi-eur1-prd-platform-rg

  # Destination label matches the Kratix Destination object
  destinationSelectors:
  - matchLabels:
      kratix.destination: "true"

  # XRD and Composition deployed to the workload cluster before scheduling requests.
  # Crossplane on the workload cluster reconciles XStorageAccount → Azure Account.
  dependencies:
  - apiVersion: apiextensions.crossplane.io/v1
    kind: CompositeResourceDefinition
    metadata:
      name: xstorageaccounts.platform.teknologi.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      group: platform.teknologi.io
      names:
        kind: XStorageAccount
        plural: xstorageaccounts
      versions:
      - name: v1alpha1
        served: true
        referenceable: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required: [appName, environment, storageAccountName]
                properties:
                  appName:
                    type: string
                  environment:
                    type: string
                    default: dev
                    enum: [dev, tst, acc, prd]
                  storageAccountName:
                    type: string
                    description: "Pre-computed Azure storage account name (3-24 chars lowercase alphanumeric)"
                  location:
                    type: string
                    default: westeurope
                  resourceGroupName:
                    type: string
                    default: teknologi-eur1-prd-platform-rg
              status:
                type: object
                properties:
                  storageAccountName:
                    type: string
                  primaryBlobEndpoint:
                    type: string
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xstorageaccount-azure
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        provider: azure
    spec:
      compositeTypeRef:
        apiVersion: platform.teknologi.io/v1alpha1
        kind: XStorageAccount
      mode: Resources
      resources:
      - name: storage-account
        base:
          apiVersion: storage.azure.upbound.io/v1beta2
          kind: Account
          spec:
            forProvider:
              accountKind: StorageV2
              accountTier: Standard
              accountReplicationType: LRS
              httpsTrafficOnlyEnabled: true
              minTlsVersion: TLS1_2
            providerConfigRef:
              name: azure-provider
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.storageAccountName
          toFieldPath: metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.storageAccountName
          toFieldPath: metadata.annotations[crossplane.io/external-name]
        - type: FromCompositeFieldPath
          fromFieldPath: spec.location
          toFieldPath: spec.forProvider.location
          policy:
            fromFieldPath: Optional
        - type: FromCompositeFieldPath
          fromFieldPath: spec.resourceGroupName
          toFieldPath: spec.forProvider.resourceGroupName
          policy:
            fromFieldPath: Optional
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: status.storageAccountName
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.primaryBlobEndpoint
          toFieldPath: status.primaryBlobEndpoint
          policy:
            fromFieldPath: Optional

  # Pipeline — runs when a team creates a StorageAccountRequest.
  # Writes XStorageAccount YAML to /kratix/output — no Terraform, no Azure credentials in the pipeline.
  # Crossplane on the workload cluster handles all Azure provisioning.
  workflows:
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: configure-storage-account
        spec:
          imagePullSecrets:
          - name: acr-credentials
          containers:
          - name: configure-storage-account
            image: teknologieur1acr.azurecr.io/kratix-storage-account:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
          - name: notify
            image: teknologieur1acr.azurecr.io/kratix-notify:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: NOTIFY_STAGE
              value: "1"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
                  optional: true
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: argocdUrl
