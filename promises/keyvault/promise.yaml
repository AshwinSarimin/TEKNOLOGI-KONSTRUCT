apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  name: keyvault
spec:
  # KeyVaultRequest CRD — what teams submit to request an Azure Key Vault
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: keyvaultrequests.marketplace.kratix.io
    spec:
      group: marketplace.kratix.io
      scope: Namespaced
      names:
        kind: KeyVaultRequest
        plural: keyvaultrequests
        singular: keyvaultrequest
      versions:
      - name: v1alpha1
        served: true
        storage: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required:
                - appName
                - environment
                - resourceGroupName
                properties:
                  appName:
                    type: string
                    description: "Application name — used in the Key Vault name (kv-{appName}-{env})"
                  environment:
                    type: string
                    description: "Deployment environment"
                    default: dev
                    enum: [dev, tst, acc, prd]
                  location:
                    type: string
                    description: "Azure region (default: westeurope)"
                    default: westeurope
                  resourceGroupName:
                    type: string
                    description: "Azure resource group to provision the Key Vault into"

  # Destination label matches the Kratix Destination object (not the ArgoCD cluster secret)
  destinationSelectors:
  - matchLabels:
      kratix.destination: "true"

  # Deploy XRD and Composition to destination before scheduling requests.
  # notify-watcher SA/ClusterRole/CRB are defined in the namespace Promise — not repeated here.
  dependencies:
  - apiVersion: apiextensions.crossplane.io/v1
    kind: CompositeResourceDefinition
    metadata:
      name: xkeyvaults.platform.teknologi.io
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      group: platform.teknologi.io
      names:
        kind: XKeyVault
        plural: xkeyvaults
      versions:
      - name: v1alpha1
        served: true
        referenceable: true
        schema:
          openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                required: [appName, environment, resourceGroupName]
                properties:
                  appName:
                    type: string
                  tenantId:
                    type: string
                    description: "Azure tenant ID — injected by the pipeline from platform secrets"
                  environment:
                    type: string
                    default: dev
                    enum: [dev, tst, acc, prd]
                  location:
                    type: string
                    default: westeurope
                  resourceGroupName:
                    type: string
              status:
                type: object
                properties:
                  vaultName:
                    type: string
                  vaultUri:
                    type: string
  - apiVersion: apiextensions.crossplane.io/v1
    kind: Composition
    metadata:
      name: xkeyvault-azure
      annotations:
        argocd.argoproj.io/sync-wave: "0"
      labels:
        provider: azure
    spec:
      compositeTypeRef:
        apiVersion: platform.teknologi.io/v1alpha1
        kind: XKeyVault
      mode: Resources
      resources:
      - name: keyvault
        base:
          apiVersion: keyvault.azure.upbound.io/v1beta2
          kind: Vault
          spec:
            forProvider:
              skuName: standard
              purgeProtectionEnabled: false
              softDeleteRetentionDays: 7
            providerConfigRef:
              name: azure-provider
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.tenantId
          toFieldPath: spec.forProvider.tenantId
        - type: FromCompositeFieldPath
          fromFieldPath: spec.location
          toFieldPath: spec.forProvider.location
          policy:
            fromFieldPath: Optional
        - type: FromCompositeFieldPath
          fromFieldPath: spec.resourceGroupName
          toFieldPath: spec.forProvider.resourceGroupName
          policy:
            fromFieldPath: Optional
        - type: CombineFromComposite
          combine:
            variables:
            - fromFieldPath: spec.appName
            - fromFieldPath: spec.environment
            strategy: string
            string:
              fmt: "kv-%s-%s"
          toFieldPath: metadata.name
        - type: CombineFromComposite
          combine:
            variables:
            - fromFieldPath: spec.appName
            - fromFieldPath: spec.environment
            strategy: string
            string:
              fmt: "kv-%s-%s"
          toFieldPath: spec.forProvider.name
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: status.vaultName
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.vaultUri
          toFieldPath: status.vaultUri
          policy:
            fromFieldPath: Optional

  # Pipeline — runs when a team creates a KeyVaultRequest
  workflows:
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: configure-keyvault
        spec:
          imagePullSecrets:
          - name: acr-credentials
          containers:
          - name: configure-keyvault
            image: teknologieur1acr.azurecr.io/kratix-keyvault:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: AZURE_TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: azureTenantId
          # Stage 1: posts "request accepted" + writes stage 2 watcher Job to /kratix/output
          - name: notify
            image: teknologieur1acr.azurecr.io/kratix-notify:latest
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            env:
            - name: NOTIFY_STAGE
              value: "1"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
                  optional: true
            - name: ARGOCD_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: argocdUrl