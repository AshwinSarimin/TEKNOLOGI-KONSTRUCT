# RBAC every Promise's shared "notify" container needs for its stage-2 job
# (poll XR status, record a durable Event alongside its Slack post).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notify-watcher
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notify-watcher
rules:
- apiGroups: ["platform.teknologi.io"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
# Lets stage 2 record a durable, queryable Event alongside (not instead of) its
# Slack post. Slack can be down or misconfigured and
# the fact that notification fired is still recoverable via `kubectl get events`.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notify-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: notify-watcher
subjects:
- kind: ServiceAccount
  name: notify-watcher
  namespace: default
